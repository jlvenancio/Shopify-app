# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "cartpro"
client_id = ""  # Will be filled when you create the app in Partners
application_url = "https://your-app-url.com"  # Will be updated with your deployment URL
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_orders,write_cart_transforms,read_customers,write_discounts"

[auth]
redirect_urls = [
  "https://your-app-url.com/auth/callback",
  "https://your-app-url.com/auth/shopify/callback",
  "https://your-app-url.com/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""  # Your development store URL

[[build.include_config_on_deploy]]
path = "shopify.app.toml"
